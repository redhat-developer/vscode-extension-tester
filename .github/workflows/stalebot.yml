# https://github.com/actions/stale
name: 🗄️ Close Stale Issues and PRs

on:
  schedule:
    - cron: "30 1 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🗄️ Close Inactive
        uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 7
          stale-issue-message: "This issue is stale because it has been open 60 days with no activity. Remove stale label or comment or this will be closed in 7 days."
          stale-pr-message: "This PR is stale because it has been open 60 days with no activity. Remove stale label or comment or this will be closed in 7 days."
          close-issue-message: "This issue was closed because it has been stale for 7 days with no activity."
          close-pr-message: "This PR was closed because it has been stale for 7 days with no activity."
          exempt-issue-milestones: "BACKLOG,NEXT"
          exempt-all-assignees: true
          stale-issue-label: "no-issue-activity"
          stale-pr-label: "no-pr-activity"
          exempt-issue-labels: "enhancement,question,help-wanted,do-not-stale"
          exempt-pr-labels: "help-wanted,prio,do-not-stale"
          exempt-draft-pr: true
