name: 🏗️ Main CI

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
  pull_request:
    branches:
      - main
      - auto-update-vscode-versions
    paths:
      - "**"
      - "!docs/**"
      - "!packages/extester-runner/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  unit:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 👷🏻 Checkout Repository
        uses: actions/checkout@v7

      - name: ⚙️ Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: 🔧 Install
        run: npm ci

      - name: 🔧 Build
        run: npm run build

      - name: 🔍 Run Unit Tests
        run: npm run test:unit

  main:
    name: ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: [min, max]
    uses: ./.github/workflows/template-main.yaml
    with:
      version: ${{ matrix.version }}

  runner:
    uses: ./.github/workflows/template-runner.yaml
    with:
      version: max

  check:
    if: always()
    runs-on: ubuntu-latest
    name: 🚦 Status Check
    needs: [main, runner, unit]
    steps:
      - name: ℹ️ Test Matrix Result
        run: |
          echo Unit Test result = ${{ needs.unit.result }}
          echo Main Test result = ${{ needs.main.result }}
          echo Runner Test result = ${{ needs.runner.result }}
      - name: ✅ Status Check - success
        if: ${{ needs.main.result == 'success' && needs.runner.result == 'success' && needs.unit.result == 'success' }}
        run: |
          echo "All tests successfully completed!"
          exit 0
      - name: ❌ Status Check - failure
        if: ${{ needs.main.result != 'success' || needs.runner.result != 'success' || needs.unit.result != 'success' }}
        run: |
          echo "Status Check failed!"
          exit 1
