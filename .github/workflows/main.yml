name: 🏗️ Main CI

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs-site/**"
  pull_request:
    branches:
      - main
      - auto-update-vscode-versions
    paths:
      - "**"
      - "!docs-site/**"
      - "!packages/extester-runner/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  unit:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 👷🏻 Checkout Repository
        uses: actions/checkout@v7

      - name: ⚙️ Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: 🔧 Install
        run: npm ci

      - name: 🔧 Build
        run: npm run build

      - name: 🔍 Run Unit Tests
        run: npm run test:unit

  group_01_general:
    name: 🧪 01_general
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: 01_general

  group_activityBar:
    name: 🧪 activityBar
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: activityBar

  group_bottomBar:
    name: 🧪 bottomBar
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: bottomBar

  group_cli:
    name: 🧪 cli
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: cli

  group_debug:
    name: 🧪 debug
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: debug

  group_dialog:
    name: 🧪 dialog
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: dialog

  group_editor:
    name: 🧪 editor
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: editor

  group_menu:
    name: 🧪 menu
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: menu

  group_statusBar:
    name: 🧪 statusBar
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: statusBar

  group_system:
    name: 🧪 system
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: system

  group_webview:
    name: 🧪 webview
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: webview

  group_workbench:
    name: 🧪 workbench
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: workbench

  group_xsideBar:
    name: 🧪 xsideBar
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: xsideBar

  coverage:
    name: 📊 Framework Coverage
    # Merges the V8 dumps that the ubuntu cells of every suite job collected
    # while running the UI tests (see template-suite.yaml) into one report of
    # how much of packages/* the UI tests exercise. Informational only: it is
    # not part of the status check, and it runs even when suites failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs:
      - group_01_general
      - group_activityBar
      - group_bottomBar
      - group_cli
      - group_debug
      - group_dialog
      - group_editor
      - group_menu
      - group_statusBar
      - group_system
      - group_webview
      - group_workbench
      - group_xsideBar
    steps:
      - name: 👷🏻 Checkout Repository
        uses: actions/checkout@v7

      - name: ⚙️ Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: 🔧 Install
        run: npm ci --ignore-scripts

      # The dumps reference packages/*/out/*.js by absolute path and the source
      # maps next to them; the same build at the same path is needed to remap.
      - name: 🔧 Build
        run: npm run build

      - name: 📥 Download V8 coverage dumps
        uses: actions/download-artifact@v7
        with:
          pattern: v8-coverage-*
          path: ${{ runner.temp }}/v8-downloads

      - name: 🔀 Merge dumps into one directory
        run: |
          merged="${RUNNER_TEMP}/v8-merged"
          mkdir -p "$merged"
          for dir in "${RUNNER_TEMP}"/v8-downloads/*/; do
            name=$(basename "$dir")
            for file in "$dir"*.json; do
              [ -e "$file" ] || continue
              mv "$file" "$merged/${name}-$(basename "$file")"
            done
          done
          echo "Merged $(ls "$merged" | wc -l) dump files"

      - name: 📊 Generate framework coverage report
        run: |
          npx c8 report --config .github/c8-framework.json --temp-directory "${RUNNER_TEMP}/v8-merged" | tee "${RUNNER_TEMP}/coverage.txt"
          {
            echo "## Framework coverage (packages/*, ubuntu cells)"
            echo
            echo '```'
            sed -n '/Coverage summary/,/^=*$/p' "${RUNNER_TEMP}/coverage.txt" | sed '1d;$d'
            echo '```'
            echo
            echo "Full per-file table in the job log; HTML and lcov in the framework-coverage artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 💾 Upload framework coverage report
        uses: actions/upload-artifact@v7
        with:
          name: framework-coverage
          path: coverage/framework

  runner:
    uses: ./.github/workflows/template-runner.yaml
    with:
      version: max

  check:
    if: always()
    runs-on: ubuntu-latest
    name: 🚦 Status Check
    needs:
      - unit
      - runner
      - group_01_general
      - group_activityBar
      - group_bottomBar
      - group_cli
      - group_debug
      - group_dialog
      - group_editor
      - group_menu
      - group_statusBar
      - group_system
      - group_webview
      - group_workbench
      - group_xsideBar
    steps:
      - name: ℹ️ Test Matrix Result
        run: |
          echo Unit Test result              = ${{ needs.unit.result }}
          echo Runner Test result            = ${{ needs.runner.result }}
          echo 01_general Test result        = ${{ needs.group_01_general.result }}
          echo activityBar Test result       = ${{ needs.group_activityBar.result }}
          echo bottomBar Test result         = ${{ needs.group_bottomBar.result }}
          echo cli Test result               = ${{ needs.group_cli.result }}
          echo debug Test result             = ${{ needs.group_debug.result }}
          echo dialog Test result            = ${{ needs.group_dialog.result }}
          echo editor Test result            = ${{ needs.group_editor.result }}
          echo menu Test result              = ${{ needs.group_menu.result }}
          echo statusBar Test result         = ${{ needs.group_statusBar.result }}
          echo system Test result            = ${{ needs.group_system.result }}
          echo webview Test result           = ${{ needs.group_webview.result }}
          echo workbench Test result         = ${{ needs.group_workbench.result }}
          echo xsideBar Test result          = ${{ needs.group_xsideBar.result }}
      - name: ✅ Status Check - success
        if: |
          needs.unit.result == 'success' &&
          needs.runner.result == 'success' &&
          needs.group_01_general.result == 'success' &&
          needs.group_activityBar.result == 'success' &&
          needs.group_bottomBar.result == 'success' &&
          needs.group_cli.result == 'success' &&
          needs.group_debug.result == 'success' &&
          needs.group_dialog.result == 'success' &&
          needs.group_editor.result == 'success' &&
          needs.group_menu.result == 'success' &&
          needs.group_statusBar.result == 'success' &&
          needs.group_system.result == 'success' &&
          needs.group_webview.result == 'success' &&
          needs.group_workbench.result == 'success' &&
          needs.group_xsideBar.result == 'success'
        run: |
          echo "All tests successfully completed!"
          exit 0
      - name: ❌ Status Check - failure
        if: |
          needs.unit.result != 'success' ||
          needs.runner.result != 'success' ||
          needs.group_01_general.result != 'success' ||
          needs.group_activityBar.result != 'success' ||
          needs.group_bottomBar.result != 'success' ||
          needs.group_cli.result != 'success' ||
          needs.group_debug.result != 'success' ||
          needs.group_dialog.result != 'success' ||
          needs.group_editor.result != 'success' ||
          needs.group_menu.result != 'success' ||
          needs.group_statusBar.result != 'success' ||
          needs.group_system.result != 'success' ||
          needs.group_webview.result != 'success' ||
          needs.group_workbench.result != 'success' ||
          needs.group_xsideBar.result != 'success'
        run: |
          echo "Status Check failed!"
          exit 1
