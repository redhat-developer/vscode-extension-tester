name: 🏗️ Main CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: 🔎 Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      runner: ${{ steps.filter.outputs.runner }}
    steps:
      - name: 👷🏻 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔎 Classify changed paths
        id: filter
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Jobs are gated here instead of path-filtering the workflow: a
          # path-filtered workflow never reports the required "🚦 Status Check",
          # which would block docs-only pull requests forever.
          #   docs-site/**                -> nothing to test
          #   packages/extester-runner/** -> runner jobs only
          #   anything else               -> full matrix (the runner rides on the framework)
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="HEAD^1" ;; # merge commit's first parent = base branch
            push) base="$BEFORE" ;;
            *) base="" ;; # workflow_dispatch: run everything
          esac
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No diff base available, running everything"
            echo "core=true" >> "$GITHUB_OUTPUT"
            echo "runner=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          core=false
          runner=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              docs-site/*) ;;
              packages/extester-runner/*) runner=true ;;
              *)
                core=true
                runner=true
                ;;
            esac
          done < <(git diff --name-only "$base" HEAD)
          echo "core=$core runner=$runner"
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  unit:
    name: 🧪 Unit Tests
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 👷🏻 Checkout Repository
        uses: actions/checkout@v7

      - name: ⚙️ Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: 🔧 Install
        run: npm ci

      - name: 🔧 Build
        run: npm run build

      - name: 🔍 Run Unit Tests
        run: npm run test:unit

  group_01_general:
    name: 🧪 01_general
    needs: changes
    if: needs.changes.outputs.core == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: 01_general

  group_activityBar:
    name: 🧪 activityBar
    needs: changes
    if: needs.changes.outputs.core == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: activityBar

  group_bottomBar:
    name: 🧪 bottomBar
    needs: changes
    if: needs.changes.outputs.core == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: bottomBar

  group_cli:
    name: 🧪 cli
    needs: changes
    if: needs.changes.outputs.core == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: cli

  group_debug:
    name: 🧪 debug
    needs: changes
    if: needs.changes.outputs.core == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: debug

  group_dialog:
    name: 🧪 dialog
    needs: changes
    if: needs.changes.outputs.core == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: dialog

  group_editor:
    name: 🧪 editor
    needs: changes
    if: needs.changes.outputs.core == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: editor

  group_menu:
    name: 🧪 menu
    needs: changes
    if: needs.changes.outputs.core == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: menu

  group_statusBar:
    name: 🧪 statusBar
    needs: changes
    if: needs.changes.outputs.core == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: statusBar

  group_system:
    name: 🧪 system
    needs: changes
    if: needs.changes.outputs.core == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: system

  group_webview:
    name: 🧪 webview
    needs: changes
    if: needs.changes.outputs.core == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: webview

  group_workbench:
    name: 🧪 workbench
    needs: changes
    if: needs.changes.outputs.core == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: workbench

  group_xsideBar:
    name: 🧪 xsideBar
    needs: changes
    if: needs.changes.outputs.core == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/template-suite.yaml
    with:
      test_group: xsideBar

  coverage:
    name: 📊 Framework Coverage
    # Merges the V8 dumps that the ubuntu cells of every suite job collected
    # while running the UI tests (see template-suite.yaml) into one report of
    # how much of packages/* the UI tests exercise. Informational only: it is
    # not part of the status check, and it runs even when suites failed.
    if: ${{ !cancelled() && needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    needs:
      - changes
      - group_01_general
      - group_activityBar
      - group_bottomBar
      - group_cli
      - group_debug
      - group_dialog
      - group_editor
      - group_menu
      - group_statusBar
      - group_system
      - group_webview
      - group_workbench
      - group_xsideBar
    steps:
      - name: 👷🏻 Checkout Repository
        uses: actions/checkout@v7

      - name: ⚙️ Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: 🔧 Install
        run: npm ci --ignore-scripts

      # The dumps reference packages/*/out/*.js by absolute path and the source
      # maps next to them; the same build at the same path is needed to remap.
      - name: 🔧 Build
        run: npm run build

      - name: 📥 Download V8 coverage dumps
        uses: actions/download-artifact@v8
        with:
          pattern: v8-coverage-*
          path: ${{ runner.temp }}/v8-downloads

      - name: 🔀 Merge dumps into one directory
        run: |
          merged="${RUNNER_TEMP}/v8-merged"
          mkdir -p "$merged"
          for dir in "${RUNNER_TEMP}"/v8-downloads/*/; do
            name=$(basename "$dir")
            for file in "$dir"*.json; do
              [ -e "$file" ] || continue
              mv "$file" "$merged/${name}-$(basename "$file")"
            done
          done
          echo "Merged $(ls "$merged" | wc -l) dump files"

      - name: 📊 Generate framework coverage report
        run: |
          npx c8 report --config .github/c8-framework.json --temp-directory "${RUNNER_TEMP}/v8-merged" | tee "${RUNNER_TEMP}/coverage.txt"
          {
            echo "## Framework coverage (packages/*, ubuntu cells)"
            echo
            echo '```'
            sed -n '/Coverage summary/,/^=*$/p' "${RUNNER_TEMP}/coverage.txt" | sed '1d;$d'
            echo '```'
            echo
            echo "Full per-file table in the job log; HTML and lcov in the framework-coverage artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 💾 Upload framework coverage report
        uses: actions/upload-artifact@v7
        with:
          name: framework-coverage
          path: coverage/framework

  runner:
    needs: changes
    if: needs.changes.outputs.runner == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/template-runner.yaml
    with:
      version: max

  check:
    name: 🚦 Status Check
    # Always reported, so branch protection can require it for every change.
    # Jobs skipped by the `changes` gate count as success; only a failed or
    # cancelled job fails the check.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs:
      - changes
      - unit
      - runner
      - group_01_general
      - group_activityBar
      - group_bottomBar
      - group_cli
      - group_debug
      - group_dialog
      - group_editor
      - group_menu
      - group_statusBar
      - group_system
      - group_webview
      - group_workbench
      - group_xsideBar
    steps:
      - name: ℹ️ Job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'

      - name: ✅ Status Check - success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "All jobs required for this change succeeded."

      - name: ❌ Status Check - failure
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "Status Check failed!"
          exit 1
