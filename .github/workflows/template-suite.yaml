name: 📄 Suite CI - template

on:
  workflow_call:
    inputs:
      test_group:
        required: true
        type: string
      nodejs:
        required: false
        default: "lts/*"
        type: string
      code_type:
        required: false
        default: "stable"
        type: string

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: ubuntu-min
            version: min
          - os: ubuntu-latest
            label: ubuntu-max
            version: max
          - os: macos-latest
            label: macos-min
            version: min
          - os: macos-latest
            label: macos-max
            version: max
          - os: windows-latest
            label: windows-min
            version: min
          - os: windows-latest
            label: windows-max
            version: max

    env:
      CODE_TYPE: ${{ inputs.code_type }}
      CODE_VERSION: ${{ matrix.version }}

    steps:
      - name: 👷🏻 Checkout Repository
        uses: actions/checkout@v7

      - name: ⚙️ Set TEST_RESOURCES path
        run: echo "TEST_RESOURCES=${{ runner.temp }}/test-resources" >> $GITHUB_ENV
        shell: bash

      - name: ⚙️ Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.nodejs }}
          cache: npm

      - name: 🔧 Install
        run: npm ci --ignore-scripts

      - name: 🔧 Build
        run: npm run build

      - name: ✨ Code Formatter - Prettier
        run: ./node_modules/.bin/prettier . --check

      - name: 🔧 Install - Test Project
        run: npm install --workspace=extester-test

      - name: 🔍 Run Tests (macOS, windows)
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: npm run test:${{ inputs.test_group }} --workspace=extester-test

      - name: ⚙️ Allow unprivileged user namespace (ubuntu)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: 🔍 Run Tests (linux)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npm run test:${{ inputs.test_group }} --workspace=extester-test
        env:
          # Framework coverage: every Node process spawned from here (the
          # ExTester/Mocha runner included) dumps V8 coverage into this folder
          # on exit. The dumps are merged into one report by the `coverage`
          # job in main.yml. Linux only - the merge needs identical absolute
          # paths to remap the dumps, and the ubuntu runners share them.
          NODE_V8_COVERAGE: ${{ runner.temp }}/v8-coverage

      - name: ✂️ Trim V8 coverage dumps to framework code (linux)
        if: ${{ !cancelled() && startsWith(matrix.os, 'ubuntu') }}
        run: node .github/scripts/trim-v8-coverage.mjs "${RUNNER_TEMP}/v8-coverage" "${GITHUB_WORKSPACE}"

      - name: 💾 Upload V8 coverage dumps (linux)
        uses: actions/upload-artifact@v7
        # Failing tests still produce valid coverage for the code they ran.
        if: ${{ !cancelled() && startsWith(matrix.os, 'ubuntu') }}
        with:
          name: v8-coverage-${{ inputs.test_group }}-${{ matrix.label }}
          path: ${{ runner.temp }}/v8-coverage
          if-no-files-found: warn
          retention-days: 3

      - name: 💾 Upload Screenshots and ChromeDriver logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots-and-logs-${{ matrix.label }}-${{ inputs.test_group }}
          path: |
            ${{ runner.temp }}/test-resources/screenshots/**/*.png
            ${{ runner.temp }}/test-resources/chromedriver.log
            ${{ runner.temp }}/test-resources/crashes/**
